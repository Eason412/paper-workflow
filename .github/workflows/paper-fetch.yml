name: Paper Fetch

on:
  push:
    paths:
      - "skills/oa-paper-fetch/**"
      - "tests/**"
      - ".gitignore"
      - ".github/workflows/paper-fetch.yml"
  pull_request:
    paths:
      - "skills/oa-paper-fetch/**"
      - "tests/**"
      - ".gitignore"
      - ".github/workflows/paper-fetch.yml"

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

defaults:
  run:
    working-directory: skills/oa-paper-fetch

jobs:
  regression:
    name: Offline regression (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Offline regression
        run: python -m unittest discover -s tests -v
      - name: CLI smoke
        if: matrix.python == '3.12'
        run: |
          python oa_fetch.py --help
          python oa_fetch.py --version
      - name: Repository artifact isolation
        if: matrix.python == '3.12'
        working-directory: .
        run: python -m unittest discover -s tests -v

  filesystem:
    name: Filesystem regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Storage, filename and configuration regressions
        run: |
          python -m unittest discover -s tests -p test_store_resume.py -v
          python -m unittest discover -s tests -p test_filename_metadata.py -v
          python -m unittest discover -s tests -p test_config.py -v
