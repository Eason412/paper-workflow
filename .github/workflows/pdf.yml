name: Course Report PDF

on:
  push:
    paths:
      - "skills/md-course-report-to-pdf/**"
      - ".github/workflows/pdf.yml"
  pull_request:
    paths:
      - "skills/md-course-report-to-pdf/**"
      - ".github/workflows/pdf.yml"

jobs:
  regression:
    name: Regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        working-directory: skills/md-course-report-to-pdf
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run regression tests
        run: python -m unittest discover -s tests -p test_unit.py -v

  smoke:
    name: Full PDF smoke (Pandoc ${{ matrix.pandoc-version }})
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        working-directory: skills/md-course-report-to-pdf
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        pandoc-version: ["3.1.3", "3.10.1"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install fonts and PDF tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk poppler-utils qpdf

      - name: Install pinned Pandoc
        uses: pandoc/actions/setup@v1.1.1
        with:
          version: ${{ matrix.pandoc-version }}

      - name: Check Pandoc
        run: pandoc --version

      - name: Cache Tectonic packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/Tectonic
          key: ${{ runner.os }}-tectonic-0.17.0-${{ hashFiles('skills/md-course-report-to-pdf/assets/templates/**/*.tex', 'skills/md-course-report-to-pdf/examples/**/*.md') }}
          restore-keys: |
            ${{ runner.os }}-tectonic-0.17.0-

      - name: Set up Tectonic
        uses: wtfjoke/setup-tectonic@v4
        with:
          tectonic-version: "0.17.0"

      - name: Check PDF compiler
        run: tectonic --version

      - name: Run Pandoc integration regressions
        env:
          MD_COURSE_REPORT_REQUIRE_PANDOC: "1"
        run: python -m unittest discover -s tests -p test_integration.py -v

      - name: Run smoke tests
        env:
          MD_COURSE_REPORT_REQUIRE_COMPILER: "1"
          MD_COURSE_REPORT_REQUIRE_PDF_TOOLS: "1"
        run: python scripts/run_smoke_tests.py
