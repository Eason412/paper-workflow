name: Smoke Test

on:
  push:
  pull_request:

jobs:
  regression:
    name: Regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: python -m compileall -q scripts tests

      - name: Run regression tests
        run: python -m unittest -v tests.test_regressions

  smoke:
    name: Full PDF smoke (Pandoc ${{ matrix.pandoc-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        pandoc-version: ["3.1.3", "3.10.1"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install fonts and PDF tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk poppler-utils qpdf

      - name: Install pinned Pandoc
        uses: pandoc/actions/setup@v1.1.1
        with:
          version: ${{ matrix.pandoc-version }}

      - name: Check Pandoc
        run: pandoc --version

      - name: Cache Tectonic packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/Tectonic
          key: ${{ runner.os }}-tectonic-${{ hashFiles('assets/templates/**/*.tex', 'examples/**/*.md') }}
          restore-keys: |
            ${{ runner.os }}-tectonic-

      - name: Set up Tectonic
        uses: wtfjoke/setup-tectonic@v4

      - name: Check PDF compiler
        run: tectonic --version

      - name: Run Pandoc integration regressions
        run: python3 -m unittest -v tests.test_regressions

      - name: Run smoke tests
        env:
          MD_COURSE_REPORT_REQUIRE_COMPILER: "1"
          MD_COURSE_REPORT_REQUIRE_PDF_TOOLS: "1"
        run: python3 scripts/run_smoke_tests.py
